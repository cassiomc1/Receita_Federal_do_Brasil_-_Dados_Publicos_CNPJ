<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema - CNPJ Explorer</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-zinc-50 text-zinc-900 antialiased flex items-center justify-center p-4">

    <div class="w-full max-w-sm">
        <!-- Brand Header -->
        <div class="flex flex-col items-center mb-6 text-center">
            <div class="h-10 w-10 rounded-lg bg-zinc-900 flex items-center justify-center text-white mb-3 shadow-sm">
                <i data-lucide="building-2" class="w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-semibold tracking-tight text-zinc-900">CNPJ Explorer</h1>
            <p class="text-xs text-zinc-500 mt-1">Dados Públicos da Receita Federal do Brasil</p>
        </div>

        <!-- Card Shadcn UI Style -->
        <div class="bg-white border border-zinc-200 rounded-xl shadow-sm p-6">
            <div class="mb-5">
                <h2 class="text-base font-medium text-zinc-900">Autenticação</h2>
                <p class="text-xs text-zinc-500 mt-0.5">Insira as credenciais geradas no terminal para entrar.</p>
            </div>

            {% if error_message %}
            <div class="mb-4 p-3 rounded-md bg-red-50 border border-red-200 text-red-700 text-xs flex items-center gap-2">
                <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
                <span>{{ error_message }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('login') }}" class="space-y-4">
                <div class="space-y-1.5">
                    <label for="username" class="text-xs font-medium text-zinc-700">Usuário</label>
                    <div class="relative">
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            value="{{ hint_user }}"
                            placeholder="admin"
                            class="w-full h-9 px-3 rounded-md border border-zinc-200 bg-transparent text-sm shadow-sm transition-colors placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950"
                        >
                    </div>
                </div>

                <div class="space-y-1.5">
                    <label for="password" class="text-xs font-medium text-zinc-700">Senha Temporária</label>
                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            autofocus
                            placeholder="rfb-xxxxxx"
                            class="w-full h-9 px-3 rounded-md border border-zinc-200 bg-transparent text-sm shadow-sm transition-colors placeholder:text-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-950 font-mono"
                        >
                    </div>
                </div>

                <div class="pt-1">
                    <button
                        type="submit"
                        class="w-full h-9 px-4 bg-zinc-900 hover:bg-zinc-800 text-white rounded-md text-sm font-medium transition-colors shadow-sm flex items-center justify-center gap-2"
                    >
                        <span>Entrar no Sistema</span>
                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                    </button>
                </div>
            </form>

            <div class="mt-5 pt-4 border-t border-zinc-100 flex items-center justify-center text-[11px] text-zinc-400 gap-1.5">
                <i data-lucide="shield-check" class="w-3.5 h-3.5 text-zinc-500"></i>
                <span>Credencial renovada a cada boot do servidor</span>
            </div>
        </div>

        <p class="text-center text-xs text-zinc-400 mt-6">
            Receita Federal do Brasil &bull; Dados Abertos
        </p>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
